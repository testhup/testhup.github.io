# Pages CMS configuration (generated from the site content). https://pagescms.org/docs/configuration/
# Every field in every content file is listed here, so saving from the CMS does not drop any data.
media:
- name: images
  label: Images
  input: public/images
  output: /images
- name: files
  label: Files (PDF, documents)
  input: public/files
  output: /files
content:
- name: settings
